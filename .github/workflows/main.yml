name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Force Unzip accurately
      run: |
        sudo apt-get install -y unzip
        unzip -q "*صوتية*.zip" -d ./project || true

    - name: Search and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: |
          **/*.apk
          
