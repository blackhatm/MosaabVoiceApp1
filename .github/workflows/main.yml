name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip project
      run: unzip -q "تجربة-صوتية (1).zip" -d ./project || unzip -q "تجربة-صوتية.zip" -d ./project || true

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        cd project 2>/dev/null || cd .
        if [ -d "app" ]; then
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug 2>/dev/null || echo "Using prebuilt APK"
        fi

    - name: Upload Prebuilt APK
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: |
          **/build/outputs/apk/debug/*.apk
          **/.build-outputs/app-debug.apk
          
